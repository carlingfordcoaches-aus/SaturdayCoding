<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Web Project</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>🌟 Welcome to My Website</h1>
    </header>

    <main>
      <section id="home">
        <h2>Home</h2>
        <p>THIS IS STEVIE'S HTML PAGE</p>
        <button onclick="changetoStartPage()" id="clickButton">
          Start Page
        </button>
        <button onclick="changeToCreatePage()">Create Page</button>
        <button onclick="changeToPlayPage()" id="Click">Go to playPage</button>
        <p id="message"></p>
      </section>

      <script>
        function changetoStartPage() {
          window.location.href = "/StartPage.html";
        }
        function changeToPlayPage() {
          window.location.href = "/playPage.html";
        }
        function changeToCreatePage() {
          window.location.href = "/createPage.html";
        }
      </script>

      <section id="about">
        <h2>About</h2>
        <p>A quiz game</p>
      </section>
      <section id="contact">
        <h2>Contact</h2>
        <form id="contactForm">
          <label>
            Your Name:
            <input type="text" id="nameInput" required />
          </label>
          <label>
            Message:
            <textarea id="messageInput" rows="3" required></textarea>
          </label>
          <button type="submit">Send</button>
        </form>
        <p id="formFeedback"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
